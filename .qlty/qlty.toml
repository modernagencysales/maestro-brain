# qlty — the gate that catches what ESLint can't: cross-file DUPLICATION
# (identical/similar code) plus secret + dependency scanning. Block mode,
# full-repo. Greenfield starts at zero duplication, so block is safe and
# copy-paste sprawl can never take root.
config_version = "0"

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "**/_generated/**",
  "apps/web/src/routeTree.gen.ts",
  "packages/template-core/src/generated/**",
  "packages/template-core/src/generated/confectManifest.ts",
  "**/packages/template-core/src/generated/confectManifest.ts",
  "**/*.d.ts",
  "pnpm-lock.yaml",
  "tooling/**",
  "repos/**",
  ".pnpm-store/**",
]

test_patterns = ["**/*.test.*", "**/*.spec.*", "**/__tests__/**"]

[[source]]
name = "default"
default = true

# Structural smells — BLOCKING (greenfield = 0; any new duplication/complexity
# is rejected). ESLint owns per-function complexity at the source; qlty adds
# the cross-file duplication detection ESLint cannot do.
[smells]
mode = "block"

[smells.identical_code]
threshold = 12
[smells.similar_code]
threshold = 15
[smells.function_complexity]
threshold = 10
[smells.file_complexity]
threshold = 50
[smells.return_statements]
threshold = 5
[smells.boolean_logic]
threshold = 4
[smells.function_parameters]
threshold = 5
[smells.nested_control_flow]
threshold = 4

[[triage]]
match.rules = ["qlty:similar-code"]
match.file_patterns = ["packages/template-core/src/generated/confectManifest.ts"]
set.ignored = true

# Qlty invokes Gitleaks one file at a time without applying the repository's
# custom .gitleaks.toml. Its built-in generic-key heuristic consequently treats
# typed test identifiers such as brainKey and idempotencyKey as credentials.
# Limit the exception to that heuristic and Convex test fixtures; concrete
# provider-token and vendor-secret rules continue to scan these files.
[[triage]]
match.rules = ["gitleaks:generic-api-key"]
match.file_patterns = ["packages/convex/test/**"]
set.ignored = true

[[exclude]]
plugins = ["qlty"]
file_patterns = ["packages/template-core/src/generated/confectManifest.ts"]

# Commit f71717f2 imports the canonical SaaS UI workspace chassis as a single
# upstream shelf. Keep its existing structural findings visible as monitored
# import debt instead of forking those prebuilt screens during adoption. New
# rules or findings in product-owned adapters remain blocking, and paths leave
# this ledger when they are deliberately refactored.
[[triage]]
match.rules = ["qlty:function-complexity"]
match.file_patterns = [
  "apps/web/src/components/breadcrumbs/breadcrumbs.tsx",
  "apps/web/src/components/data-board/data-board.tsx",
  "apps/web/src/components/sortable-nav-group/sortable-nav-group.tsx",
  "apps/web/src/components/tags-list/tags-list.tsx",
  "apps/web/src/features/billing/components/pricing-table.tsx",
  "apps/web/src/features/common/components/invite-people.tsx",
  "apps/web/src/features/contacts/inbox/inbox-list.tsx",
  "apps/web/src/features/contacts/list/list-page.tsx",
  "apps/web/src/features/getting-started/create-workspace.tsx",
  "apps/web/src/features/settings/account/account-notifications-page.tsx",
  "apps/web/src/features/settings/members/members-page.tsx",
  "apps/web/src/features/settings/tags/manage-tags.tsx",
  "apps/web/src/features/settings/workspace/workspace-settings-page.tsx",
  "apps/web/src/hooks/use-open-state.ts",
]
set.mode = "monitor"

[[triage]]
match.rules = ["qlty:return-statements"]
match.file_patterns = [
  "apps/web/src/features/getting-started/create-workspace.tsx",
  "apps/web/src/features/settings/members/members-page.tsx",
]
set.mode = "monitor"

[[triage]]
match.rules = ["qlty:similar-code"]
match.file_patterns = [
  "apps/web/src/features/settings/members/members-page.tsx",
]
set.mode = "monitor"

[[plugin]]
name = "gitleaks"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"
